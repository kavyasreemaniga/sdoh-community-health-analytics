name: 'sdoh_analytics'
version: '1.0.0'
config-version: 2

profile: 'sdoh_analytics'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  sdoh_analytics:
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: marts

# Disable schema name appending
dispatch:
  - macro_namespace: dbt
    search_order: ['sdoh_analytics', 'dbt']
